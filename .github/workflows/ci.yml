name: CI Pipeline

on:
  push:
    branches:
      - main

    paths-ignore:
      - 'k8s/deployment.yaml'

permissions:
  contents: write

jobs:

  build-and-push:

    runs-on: ubuntu-latest

    env:
      IMAGE_TAG: ${{ github.sha }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
          -t miroslavaskl126/flask-app:${IMAGE_TAG} \
          ./app

      - name: Push Docker image
        run: |
          docker push miroslavaskl126/flask-app:${IMAGE_TAG}

      - name: Update deployment.yaml
        run: |
          sed -i "s|image: .*|image: miroslavaskl126/flask-app:${IMAGE_TAG}|g" k8s/deployment.yaml
          sed -i "s|value: \".*\"|value: \"${IMAGE_TAG}\"|g" k8s/deployment.yaml

      - name: Configure Git
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      - name: Commit and push changes
        run: |
          git add k8s/deployment.yaml
          git commit -m "Update image tag to ${IMAGE_TAG}" || echo "No changes to commit"
          git push