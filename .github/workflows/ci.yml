name: CI Pipeline
on: 
  push: # if you do push start pipeline
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3 # download  repository files
      
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
    
      - name: Build docker image
        run: docker build -t miroslavaskl126/flask-app:${{ github.sha }} ./app

      - name: Push docker image to DockerHub
        run: docker push  miroslavaskl126/flask-app:${{ github.sha }}
