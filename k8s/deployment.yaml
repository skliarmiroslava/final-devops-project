apiVersion: apps/v1

kind: Deployment

metadata:
  name: flask-app

spec:
  replicas: 1

  selector:
    matchLabels:
      app: flask-app

  template:
    metadata:
      labels:
        app: flask-app

    spec:
      containers:
        - name: flask-app

          image: miroslavaskl126/flask-app:2eceae105361b70eee81c99492ab5d39d337733a

          imagePullPolicy: Always

          ports:
            - containerPort: 5000
          
          env:
            - name: VERSION 
              value: "2eceae105361b70eee81c99492ab5d39d337733a"