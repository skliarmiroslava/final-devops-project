apiVersion: apps/v1

kind: Deployment

metadata:
  name: flask-app

spec:
  replicas: 1

  selector:
    matchLabels:
      app: flask-app

  template:
    metadata:
      labels:
        app: flask-app

    spec:
      containers:
        - name: flask-app

          image: miroslavaskl126/flask-app:ada27c3c83e05c9299319cafd04b32bfc3131914

          imagePullPolicy: Always

          ports:
            - containerPort: 5000