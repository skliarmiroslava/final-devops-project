apiVersion: apps/v1

kind: Deployment

metadata:
  name: flask-app

spec:
  replicas: 1

  selector:
    matchLabels:
      app: flask-app

  template:
    metadata:
      labels:
        app: flask-app

    spec:
      containers:
        - name: flask-app

          image: miroslavaskl126/flask-app:9fd149c47868d5a7a661d4e3327420f2628664bc

          imagePullPolicy: Always

          ports:
            - containerPort: 5000
          
          env:
            - name: VERSION 
              value: "9fd149c47868d5a7a661d4e3327420f2628664bc"