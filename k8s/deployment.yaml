apiVersion: apps/v1

kind: Deployment

metadata:
  name: flask-app

spec:
  replicas: 1

  selector:
    matchLabels:
      app: flask-app

  template:
    metadata:
      labels:
        app: flask-app

    spec:
      containers:
        - name: flask-app

          image: miroslavaskl126/flask-app:0d070e30dc794f29b65bc6340c7f956d273fda5f

          imagePullPolicy: Always

          ports:
            - containerPort: 5000
          
          env:
            - name: VERSION 
              value: "0d070e30dc794f29b65bc6340c7f956d273fda5f"